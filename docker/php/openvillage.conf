ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /app/web/public

    Alias /game/ /app/main_script/copyable/public/
    Alias /gpack/ /app/sections/gpack/

    <Directory /app/web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /app/main_script/copyable/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /app/sections/gpack>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Styles other than a17a8f72 reuse its CSS/fonts and fill missing images from it (see gpack.php).
        RewriteEngine On
        RewriteBase /gpack/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond $1 !=a17a8f72
        RewriteRule ^([A-Za-z0-9]+)/mainPage/(.+)$ a17a8f72/mainPage/$2 [L]
    </Directory>

    RedirectMatch 302 ^/game$ /game/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
