name: iOS – OpenVillage offline app

on:
  # Build only by hand (Actions → Run workflow), not after every pushed commit.
  # The checkboxes pick which graphic packs (gpacks) go into the app; Legends 655.3 (default look) is always in.
  # Each extra pack adds roughly 30–125 MB to the IPA.
  workflow_dispatch:
    inputs:
      gpack_29c89d54:
        description: "Travian T4.6 (29c89d54, přidá i OpenVillage 4.6)"
        type: boolean
        default: false
      gpack_a17a8f72:
        description: "OpenVillage 4.6 (a17a8f72)"
        type: boolean
        default: false
      gpack_d11cb434:
        description: "Travian T4.4 Seasonized v2 (d11cb434)"
        type: boolean
        default: false
      gpack_68597666:
        description: "Travian T4.4 Seasonized (68597666)"
        type: boolean
        default: false
      gpack_TravianOld:
        description: "Travian T4.4 Classic (TravianOld)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MARIADB_FORMULA: mariadb@11.4

jobs:
  # ------------------------------------------------------------------ PHP 8.3 (ZTS) as a static library
  php-core:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            .github
      - name: Cache PHPCore
        id: cache
        uses: actions/cache@v4
        with:
          path: ios/php/build/PHPCore.xcframework
          key: t46-phpcore-${{ hashFiles('ios/php/build-php-ios.sh', 'ios/php/PHPCore.h', 'ios/php/module.modulemap') }}
      - name: Build PHP for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          ios/php/build-php-ios.sh 2>&1 | tee ios-php-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: PHPCore.xcframework
          path: ios/php/build/PHPCore.xcframework
      - name: Report logs
        if: always()
        run: |
          set +e
          R="$RUNNER_TEMP/report/t46-run-${{ github.run_number }}-php"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$R/STATUS"
          cp ios-php-build.log "$R/" 2>/dev/null
          for p in iphoneos iphonesimulator; do
            for f in libpng.log libjpeg.log php-configure.log php-config.log; do
              [ -f ios/php/build/$p/$f ] && tail -n 300 ios/php/build/$p/$f > "$R/$p-$f"
            done
            [ -f ios/php/build/$p/php-make.log ] && grep -n -B3 -A12 -E "error:|Error [0-9]" ios/php/build/$p/php-make.log | tail -n 400 > "$R/$p-php-make-errors.log"
          done
          .github/scripts/push-ci-logs.sh "$RUNNER_TEMP/report" "${{ secrets.GITHUB_TOKEN }}"

  # ------------------------------------------------------------------ MariaDB server as a static library
  mariadb-core:
    runs-on: macos-15
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        platform: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            .github
      - name: Tools + MariaDB version
        run: |
          brew install bison ninja >/dev/null
          V=$(brew info --json=v2 "$MARIADB_FORMULA" | python3 -c 'import json,sys;print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
          echo "MARIADB_VERSION=$V" >> "$GITHUB_ENV"; echo "MariaDB $V"
      - name: Cache MariaDB slice
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ios/mariadb/build/${{ matrix.platform }}/libmariadbcore.a
            ios/mariadb/build/${{ matrix.platform }}/include
            ios/mariadb/build/share
          key: t46-mariadb-${{ matrix.platform }}-${{ env.MARIADB_VERSION }}-${{ hashFiles('ios/mariadb/build-mariadb-ios.sh', 'ios/mariadb/mariadb-options.cmake', 'ios/mariadb/patch-source.py', 'ios/mariadb/MariaDBCore.h', 'ios/mariadb/module.modulemap') }}
      - name: Build MariaDB for ${{ matrix.platform }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          ios/mariadb/build-mariadb-ios.sh ${{ matrix.platform }} 2>&1 | tee mariadb-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mariadb-${{ matrix.platform }}
          path: |
            ios/mariadb/build/${{ matrix.platform }}/libmariadbcore.a
            ios/mariadb/build/${{ matrix.platform }}/include
            ios/mariadb/build/share
      - name: Report logs
        if: always()
        run: |
          set +e
          R="$RUNNER_TEMP/report/t46-run-${{ github.run_number }}-mariadb-${{ matrix.platform }}"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }} version=$MARIADB_VERSION" > "$R/STATUS"
          tail -n 200 mariadb-build.log > "$R/build-tail.log" 2>/dev/null
          B=ios/mariadb/build
          for f in host-configure.log host-build.log; do [ -f $B/$f ] && tail -n 150 $B/$f > "$R/$f"; done
          P=$B/${{ matrix.platform }}
          [ -f $P/pcre2.log ] && tail -n 80 $P/pcre2.log > "$R/pcre2.log"
          [ -f $P/mariadb-configure.log ] && tail -n 250 $P/mariadb-configure.log > "$R/configure.log"
          [ -f $P/mariadb/CMakeFiles/CMakeConfigureLog.yaml ] && grep -n -B5 -A30 "exitCode: [1-9]" $P/mariadb/CMakeFiles/CMakeConfigureLog.yaml | tail -n 400 > "$R/configure-failed-checks.log"
          [ -f $P/mariadb-build.log ] && grep -n -B4 -A14 -E "error:|FAILED" $P/mariadb-build.log | head -n 500 > "$R/build-errors.log"
          [ -f $P/link-command.txt ] && cp $P/link-command.txt "$R/"
          [ -f $P/inputs.txt ] && cp $P/inputs.txt "$R/"
          .github/scripts/push-ci-logs.sh "$RUNNER_TEMP/report" "${{ secrets.GITHUB_TOKEN }}"

  # ------------------------------------------------------------------ app: build, simulator e2e test, IPA
  app:
    needs: [php-core, mariadb-core]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PHPCore.xcframework
          path: ios/php/build/PHPCore.xcframework
      - uses: actions/download-artifact@v4
        with:
          pattern: mariadb-*
          path: ios/mariadb/build
          merge-multiple: true
      - name: Tools
        run: brew install xcodegen "$MARIADB_FORMULA" >/dev/null
      - name: Xcode 26 (Liquid Glass toolbar; older Xcode builds the classic bar)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Legends lobby graphics (fetched, not in the repository)
        run: python3 -I scripts/gpack/fetch-lobby-assets.py
      - name: MariaDB xcframework + data template
        run: |
          set -o pipefail
          ls -la ios/mariadb/build ios/mariadb/build/* | head -40 | tee prep.log
          bash ios/mariadb/make-xcframework.sh 2>&1 | tee -a prep.log
          bash ios/mariadb/make-template.sh ios/mariadb/build/template openvillage-ios-local 2>&1 | tee -a prep.log
      - name: Selected graphic packs
        run: |
          G=""
          ${{ inputs.gpack_29c89d54 == true }} && G="$G,29c89d54"
          ${{ inputs.gpack_a17a8f72 == true }} && G="$G,a17a8f72"
          ${{ inputs.gpack_d11cb434 == true }} && G="$G,d11cb434"
          ${{ inputs.gpack_68597666 == true }} && G="$G,68597666"
          ${{ inputs.gpack_TravianOld == true }} && G="$G,TravianOld"
          G="${G#,}"
          echo "OV_GPACKS=$G" >> "$GITHUB_ENV"
          echo "### Graphic packs: legends655${G:+,$G}" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate Xcode project
        run: cd ios/app && xcodegen generate
      - name: Build for simulator
        run: |
          cd ios/app
          xcodebuild -project OpenVillage.xcodeproj -scheme OpenVillage -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO OV_GPACKS="$OV_GPACKS" build 2>&1 | tee ../../xcodebuild-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/OpenVillage.app
      - name: Run in simulator + end-to-end test
        id: e2e
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/app/build/Build/Products/Debug-iphonesimulator/OpenVillage.app
          xcrun simctl launch "$UDID" local.openvillage.OpenVillage -port 8080
          DATA="$(xcrun simctl get_app_container "$UDID" local.openvillage.OpenVillage data)/Library/Application Support/OpenVillage"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "LOGS=$(xcrun simctl get_app_container "$UDID" local.openvillage.OpenVillage data)/Documents/logs" >> "$GITHUB_ENV"
          for i in $(seq 1 240); do
            curl -sf http://127.0.0.1:8080/health.php | grep -q '"status":"ready"' && break
            sleep 2
          done
          curl -s http://127.0.0.1:8080/health.php; echo
          xcrun simctl io "$UDID" screenshot screenshot-start.png || true
          TOKEN=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["controlToken"])' "$DATA/secrets.json")
          ADMIN=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["adminPassword"])' "$DATA/secrets.json")
          curl -s -m 30 -H "X-OV-Token: $TOKEN" http://127.0.0.1:8080/__openvillage/status > control-status.json || true
          set +e
          python3 ios/tests/e2e.py http://127.0.0.1:8080 "$TOKEN" "$ADMIN" > e2e.log 2>&1
          rc=$?
          cat e2e.log
          xcrun simctl io "$UDID" screenshot screenshot.png || true
          exit $rc
      - name: Build unsigned IPA (iPhone)
        run: |
          cd ios/app
          xcodebuild -project OpenVillage.xcodeproj -scheme OpenVillage -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" OV_GPACKS="$OV_GPACKS" build 2>&1 | tee ../../xcodebuild-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          mkdir -p Payload && cp -R build-device/Build/Products/Release-iphoneos/OpenVillage.app Payload/
          zip -qry ../../OpenVillage-unsigned.ipa Payload
          ls -lh ../../OpenVillage-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVillage-unsigned-ipa
          path: OpenVillage-unsigned.ipa
      - name: End-to-end result
        run: grep -q "E2E PASSED" e2e.log
      - name: Report logs
        if: always()
        run: |
          set +e
          R="$RUNNER_TEMP/report/t46-run-${{ github.run_number }}-app"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$R/STATUS"
          for f in prep.log e2e.log screenshot.png screenshot-start.png control-status.json; do [ -f $f ] && cp $f "$R/"; done
          for f in install.log template.err version.txt; do [ -f ios/mariadb/build/template/$f ] && head -n 150 ios/mariadb/build/template/$f > "$R/template-$f"; done
          for f in xcodebuild-sim.log xcodebuild-device.log; do
            [ -f $f ] && { grep -n -B2 -A6 -E "error:|Undefined symbol|ld: |duplicate symbol" $f | head -n 400 > "$R/${f%.log}-errors.log"; tail -n 60 $f > "$R/${f%.log}-tail.log"; }
          done
          if [ -n "$DATA" ]; then
            for f in server.log php-errors.log mariadb.log automation.log setup.log last-start.txt; do
              [ -f "$LOGS/$f" ] || continue
              { head -n 150 "$LOGS/$f"; echo "……"; tail -n 200 "$LOGS/$f"; } | grep -v " Accepted$\| Closing$" > "$R/app-$f"
            done
            ls -la "$DATA" "$LOGS" "$DATA/www" > "$R/app-files.txt" 2>&1
            tail -n 200 "$DATA/www/main_script/copyable/include/runtime/error.log" > "$R/app-game-error.log" 2>/dev/null
          fi
          [ -n "$UDID" ] && xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "OpenVillage"' --style compact 2>/dev/null | tail -n 300 > "$R/app-oslog.log"
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i openvillage | head -3 | while read c; do cp ~/Library/Logs/DiagnosticReports/"$c" "$R/"; done
          .github/scripts/push-ci-logs.sh "$RUNNER_TEMP/report" "${{ secrets.GITHUB_TOKEN }}"
