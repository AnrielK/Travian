name: iOS – PHP core + app

on:
  workflow_dispatch:
  push:
    branches: [travian-T4.4, ios-local]
    paths-ignore: ["mac-app/**", "scripts/**", "*.md"]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # -eo pipefail: a failing build must not be hidden by `| tee`

jobs:
  php-core:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            .github
      - name: Toolchain info
        run: xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; cmake --version | head -1
      - name: Cache PHPCore
        id: cache
        uses: actions/cache@v4
        with:
          path: ios/php/build/PHPCore.xcframework
          key: phpcore-${{ hashFiles('ios/php/build-php-ios.sh', 'ios/php/PHPCore.h', 'ios/php/module.modulemap') }}
      - name: Build PHP for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: ios/php/build-php-ios.sh 2>&1 | tee ios-php-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: PHPCore.xcframework
          path: ios/php/build/PHPCore.xcframework
      - name: Report logs to ci-logs branch
        if: always()
        run: |
          set +e
          D=$(mktemp -d); R="$D/run-${{ github.run_number }}-php"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$R/STATUS"
          cp ios-php-build.log "$R/" 2>/dev/null
          for p in iphoneos iphonesimulator; do
            for f in libpng.log libjpeg.log php-configure.log php-config.log; do
              [ -f ios/php/build/$p/$f ] && tail -n 300 ios/php/build/$p/$f > "$R/$p-$f"
            done
            [ -f ios/php/build/$p/php-make.log ] && grep -n -B3 -A12 -E "error:|Error [0-9]" ios/php/build/$p/php-make.log | tail -n 400 > "$R/$p-php-make-errors.log"
          done
          cd "$D" && git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@localhost
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin ci-logs && git reset -q --soft origin/ci-logs
          git add -A && git commit -qm "logs run ${{ github.run_number }} php (${{ job.status }})" && git push -q origin ci-logs

  app:
    needs: php-core
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PHPCore.xcframework
          path: ios/php/build/PHPCore.xcframework
      - name: Tools
        run: |
          brew install xcodegen >/dev/null
          python3 -m pip install --break-system-packages -q requests beautifulsoup4 || python3 -m pip install -q requests beautifulsoup4
      - name: Generate Xcode project
        run: cd ios/app && xcodegen generate
      - name: Build for simulator
        run: |
          cd ios/app
          xcodebuild -project TravianLocal.xcodeproj -scheme TravianLocal -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../xcodebuild-sim.log | grep -E "error:|warning: .*PHPCore|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/TravianLocal.app
      - name: Run in simulator + smoke test
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/app/build/Build/Products/Debug-iphonesimulator/TravianLocal.app
          xcrun simctl launch "$UDID" local.travian.TravianLocal -port 8080
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8080/login.php && break; sleep 1; done
          DATA="$(xcrun simctl get_app_container "$UDID" local.travian.TravianLocal data)/Library/Application Support/Travian"
          echo "DATA=$DATA" >> "$GITHUB_ENV"; echo "UDID=$UDID" >> "$GITHUB_ENV"
          curl -s -o /dev/null -w "login.php HTTP %{http_code}\n" http://127.0.0.1:8080/login.php
          python3 ios/tests/smoke.py http://127.0.0.1:8080 "$DATA" 2>&1 | tee smoke.log
          sleep 2; xcrun simctl io "$UDID" screenshot screenshot.png || true
      - name: Build unsigned IPA (iPhone)
        run: |
          cd ios/app
          xcodebuild -project TravianLocal.xcodeproj -scheme TravianLocal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../../xcodebuild-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          mkdir -p Payload && cp -R build-device/Build/Products/Release-iphoneos/TravianLocal.app Payload/
          zip -qry ../../TravianLocal-unsigned.ipa Payload
          ls -lh ../../TravianLocal-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TravianLocal-unsigned-ipa
          path: TravianLocal-unsigned.ipa
      - name: Report logs to ci-logs branch
        if: always()
        run: |
          set +e
          D=$(mktemp -d); R="$D/run-${{ github.run_number }}-app"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$R/STATUS"
          for f in smoke.log screenshot.png; do [ -f $f ] && cp $f "$R/"; done
          for f in xcodebuild-sim.log xcodebuild-device.log; do
            [ -f $f ] && { grep -n -B2 -A6 -E "error:|Undefined symbol|ld: " $f | head -n 300 > "$R/${f%.log}-errors.log"; tail -n 60 $f > "$R/${f%.log}-tail.log"; }
          done
          if [ -n "$DATA" ]; then
            tail -n 400 "$DATA/logs/server.log" > "$R/app-server.log" 2>/dev/null
            tail -n 200 "$DATA/logs/php_errors.log" > "$R/app-php_errors.log" 2>/dev/null
            tail -n 200 "$DATA/www/local/logs/sql_errors.log" > "$R/app-sql_errors.log" 2>/dev/null
          fi
          [ -n "$UDID" ] && xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "TravianLocal"' --style compact 2>/dev/null | tail -n 300 > "$R/app-oslog.log"
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i travian | head -3 | while read c; do cp ~/Library/Logs/DiagnosticReports/"$c" "$R/"; done
          cd "$D" && git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@localhost
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin ci-logs && git reset -q --soft origin/ci-logs
          git add -A && git commit -qm "logs run ${{ github.run_number }} app (${{ job.status }})" && git push -q origin ci-logs
