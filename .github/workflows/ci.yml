name: CI

on:
  # Runs on pull requests or by hand (Actions → Run workflow), not after every pushed commit.
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Check JavaScript syntax
        run: ./scripts/checks/check-javascript.sh
      - name: Check PHP static analysis
        run: ./scripts/checks/check-static.sh
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start a clean world
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Run verification
        run: RUN_GAME_SMOKE=1 ./scripts/verify.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color app worker bootstrap database redis
      - name: Stop services
        if: always()
        run: docker compose down --volumes
