name: macOS launcher

on:
  # Runs on pull requests or by hand (Actions → Run workflow), not after every pushed commit.
  pull_request:
    paths: ["macos/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build OpenVillage Local.app
        run: |
          set -o pipefail
          swift --version
          if ! ./macos/build-app.sh 2>&1 | tee build.log; then
            # Surface compiler errors as annotations (visible without downloading the job log).
            grep -E "error:|fatal" build.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Package
        run: cd macos/build && ditto -c -k --keepParent "OpenVillage Local.app" OpenVillageLocal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVillageLocal
          path: macos/build/OpenVillageLocal.zip
