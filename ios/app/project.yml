name: OpenVillage
options:
  bundleIdPrefix: local.openvillage
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  OpenVillage:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: ../php/build/PHPCore.xcframework
        embed: false
        link: true
      - framework: ../mariadb/build/MariaDBCore.xcframework
        embed: false
        link: true
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
      - sdk: libc++.tbd
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: OpenVillage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.openvillage.OpenVillage
        PRODUCT_NAME: OpenVillage
        OTHER_LDFLAGS: ["-ObjC", "-lc++"]
    postCompileScripts:
      - name: Bundle game files, MariaDB share and data template
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/../.."
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          DEST="$RES/game"
          mkdir -p "$DEST/scripts/native"
          # Graphic styles to ship: build setting / env OV_GPACKS (comma-separated, e.g. "29c89d54,TravianOld"
          # or "all"); the default Legends pack (legends655) is always included. Unset = legends655 only.
          # 29c89d54 serves its missing files from a17a8f72 (scripts/native/router.php), so it pulls that pack in.
          ALL_PACKS="legends655 29c89d54 a17a8f72 68597666 d11cb434 TravianOld T40"
          WANT=" legends655 "
          for p in $(echo "${OV_GPACKS:-}" | tr ',' ' '); do
            if [ "$p" = all ]; then WANT=" $ALL_PACKS "; continue; fi
            case " $ALL_PACKS " in *" $p "*) WANT="$WANT$p " ;; *) echo "warning: unknown gpack '$p' in OV_GPACKS" ;; esac
          done
          case "$WANT" in *" 29c89d54 "*) case "$WANT" in *" a17a8f72 "*) ;; *) WANT="${WANT}a17a8f72 " ;; esac ;; esac
          EXCLUDES=()
          for p in $ALL_PACKS; do
            case "$WANT" in *" $p "*) ;; *) EXCLUDES+=(--exclude "/sections/gpack/$p/") ;; esac
          done
          echo "Bundled gpacks:$WANT"
          for d in main_script web sections data; do
            rsync -a --delete --delete-excluded --exclude '.DS_Store' --exclude 'main_script/copyable/include/runtime' \
                  --exclude 'runtime/' ${EXCLUDES[@]+"${EXCLUDES[@]}"} \
                  "$SRC/$d" "$DEST/"
          done
          rsync -a --delete "$SRC/scripts/native/router.php" "$SRC/scripts/native/runtime" "$DEST/scripts/native/"
          (cd "$SRC" && git rev-parse --short HEAD 2>/dev/null || date +%s) > "$DEST/.build-id"
          date +%s >> "$DEST/.build-id"
          rsync -a --delete "${SRCROOT}/../mariadb/build/share/" "$RES/mariadb-share/"
          rsync -a --delete "${SRCROOT}/../mariadb/build/template/data/" "$RES/mariadb-template/"
