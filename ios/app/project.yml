name: TravianT46Local
options:
  bundleIdPrefix: local.travian
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TravianT46Local:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/travian.sqlite
        buildPhase: resources
    dependencies:
      - framework: ../php/build/PHPCore.xcframework
        embed: false
        link: true
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Travian T4.6
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.travian.T46Local
        PRODUCT_NAME: TravianT46Local
        OTHER_LDFLAGS: ["-ObjC"]
    postCompileScripts:
      - name: Bundle game files
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          GAME_SRC="${SRCROOT}/../.."
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/game"
          mkdir -p "$DEST"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude 'ios' --exclude 'local' --exclude 'setup' --exclude 'cpanel11' --exclude 'gpack/imge' \
            --exclude '*.zip' --exclude '*.rar' --exclude 'Thumbs.db' --exclude '*.sample' --exclude '*.tmp' --exclude '*.md' \
            --exclude 'mcache/*' --exclude 'hcache/*' --exclude 'mmark/*' --exclude 'local/logs/*' \
            --exclude 'application/queue2/*.txt' --exclude '.DS_Store' \
            "$GAME_SRC/" "$DEST/"
          (cd "$GAME_SRC" && git rev-parse --short HEAD 2>/dev/null || date +%s) > "$DEST/.build-id"
          echo "$(date +%s)" >> "$DEST/.build-id"
